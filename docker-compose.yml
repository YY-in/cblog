version: '3.8'

services:
  web:
    image: ghcr.io/YY-in/cblog:latest
    build: .
    restart: always
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAIL_RECIPIENT=${MAIL_RECIPIENT}
    # 挂载数据卷：这样你在宿主机修改文章或配置，博客能实时更新
    volumes:
      - ./content:/app/content
      - ./static:/app/static
      - ./templates:/app/templates
      - ./config.yaml:/app/config.yaml
      - ./config.zh.yaml:/app/config.zh.yaml
      - ./config.p5r.yaml:/app/config.p5r.yaml
      - ./config.p5r.zh.yaml:/app/config.p5r.zh.yaml

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/static:ro # 共享静态文件，由Nginx高效分发
    depends_on:
      - web
